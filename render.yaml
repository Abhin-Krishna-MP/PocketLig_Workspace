services:
  # ─── FastAPI Backend Service ───
  - type: web
    name: pocketlig-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r pocketlig/requirements.txt
    startCommand: cd pocketlig && python -m uvicorn pocketlig.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: POCKETLIG_ARTIFACTS
        value: artifacts
      - key: PYTHONPATH
        value: src:.

  # ─── Static Frontend Studio ───
  - type: web
    name: pocketlig-studio
    runtime: static
    buildCommand: cd pocketlig/web && npm install && npm run build
    staticPublishPath: pocketlig/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: pocketlig-api
          envVarKey: RENDER_EXTERNAL_URL
